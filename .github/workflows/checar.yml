name: Checar dados
on: [pull_request]
jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make checar
      - run: make docs && git diff --exit-code docs/ || (echo "Rode make docs e faça commit dos docs gerados" && exit 1)
